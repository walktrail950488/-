<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyTrail〜旅の記録〜</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; background: #121212; color: #fff;
        }
        
        .tab-content {
            position: absolute; top: 0; left: 0; width: 100%; bottom: 70px; display: none;
        }
        .tab-content.active { display: block; }

        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .color-palette {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            display: flex; gap: 8px; background: rgba(0,0,0,0.6); padding: 8px 12px;
            border-radius: 20px; backdrop-filter: blur(5px);
        }
        .color-dot {
            width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid #aaa;
        }
        .color-dot.active { transform: scale(1.2); border-color: #fff; box-shadow: 0 0 8px #fff; }

        .top-controls {
            position: absolute; top: 15px; right: 15px; z-index: 10;
            display: flex; flex-direction: column; gap: 10px;
        }
        .icon-btn {
            width: 44px; height: 44px; border-radius: 50%; background: rgba(30,30,30,0.85);
            border: 1px solid #444; color: #fff; font-size: 18px; display: flex; align-items: center;
            justify-content: center; cursor: pointer; backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .bottom-panel {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            z-index: 10; width: 90%; max-width: 400px; background: rgba(20,20,20,0.85);
            padding: 12px 20px; border-radius: 24px; backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 10px;
        }
        .stats-row { display: flex; justify-content: space-around; text-align: center; }
        .stat-box { display: flex; flex-direction: column; }
        .stat-label { font-size: 10px; color: #aaa; letter-spacing: 1px; }
        .stat-value { font-size: 18px; font-weight: bold; }
        
        .action-row { display: flex; gap: 10px; }
        .main-btn {
            flex: 1; padding: 12px; border-radius: 16px; border: none; font-weight: bold;
            font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        #start-btn { background: #fff; color: #000; }
        #start-btn.recording { background: #ff4757; color: #fff; }
        #photo-btn { background: rgba(255,255,255,0.15); color: #fff; }

        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 65px;
            background: #181818; border-top: 1px solid #333; z-index: 100;
            display: flex; justify-content: space-around; align-items: center;
        }
        .nav-item {
            background: none; border: none; color: #888; font-size: 12px; display: flex;
            flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 33%;
        }
        .nav-item.active { color: #fff; font-weight: bold; }

        .page-container {
            padding: 20px; box-sizing: border-box; overflow-y: auto; height: 100%;
        }
        .page-container h2 { margin-top: 0; font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .profile-card {
            background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px;
            border: 1px solid #333;
        }
        .profile-card input, .profile-card textarea {
            width: 100%; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 8px;
            border-radius: 6px; font-size: 13px; box-sizing: border-box; margin-top: 6px;
        }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75);
            z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #222; width: 88%; max-width: 380px; padding: 20px; border-radius: 20px;
            display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-height: 85vh; overflow-y: auto;
        }
        .modal-content h3 { margin: 0; font-size: 16px; font-weight: bold; }
        .modal-content input, .modal-content textarea {
            width: 100%; background: #333; border: 1px solid #444; color: #fff; padding: 10px;
            border-radius: 8px; font-size: 14px; box-sizing: border-box; resize: none;
        }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 5px; }
        .modal-btn { padding: 8px 14px; border-radius: 8px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; }
        .modal-btn.cancel { background: #444; color: #fff; }
        .modal-btn.submit { background: #2ed573; color: #fff; }
        .modal-btn.danger { background: #ff4757; color: #fff; }

        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; }
        .calendar-day-head { color: #888; padding-bottom: 4px; }
        .calendar-cell { padding: 8px 0; background: #2a2a2a; border-radius: 6px; cursor: pointer; }
        .calendar-cell.has-data { background: #1e3799; font-weight: bold; }
        .calendar-cell.selected { border: 1px solid #fff; }
        .history-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .history-item {
            background: #333; padding: 10px; border-radius: 8px; display: flex;
            justify-content: space-between; align-items: center; font-size: 13px;
        }

        .album-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
        .album-thumb { width: 100%; aspect-ratio: 1; border-radius: 6px; object-fit: cover; cursor: pointer; border: 1px solid #444; }

        #top-action-bar {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 100;
            background: rgba(255,71,87,0.95); padding: 8px 16px; border-radius: 20px; display: none;
            gap: 10px; align-items: center; font-size: 13px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        #preview-map { width: 100%; height: 200px; border-radius: 10px; background: #333; }
    </style>
</head>
<body>

    <div id="top-action-bar">
        <span id="top-action-text">操作中</span>
        <button class="modal-btn submit" id="top-action-ok" onclick="finishTopAction()">完了</button>
        <button class="modal-btn cancel" id="top-action-cancel" onclick="cancelTopAction()">中断</button>
    </div>

    <!-- TAB 1: マップ -->
    <div id="tab-map" class="tab-content active">
        <div id="map"></div>

        <div class="color-palette">
            <div class="color-dot active" style="background: #ffffff;" onclick="changeColor('#ffffff', this)"></div>
            <div class="color-dot" style="background: #3388ff;" onclick="changeColor('#3388ff', this)"></div>
            <div class="color-dot" style="background: #2ed573;" onclick="changeColor('#2ed573', this)"></div>
            <div class="color-dot" style="background: #ffa502;" onclick="changeColor('#ffa502', this)"></div>
            <div class="color-dot" style="background: #ff4757;" onclick="changeColor('#ff4757', this)"></div>
        </div>

        <div class="top-controls">
            <button class="icon-btn" onclick="centerToCurrentLocation()" title="現在地">📍</button>
        </div>

        <div class="bottom-panel">
            <div class="stats-row">
                <div class="stat-box">
                    <span class="stat-label">TIME</span>
                    <span class="stat-value" id="time-display">00:00</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">DISTANCE</span>
                    <span class="stat-value" id="dist-display">0.00 km</span>
                </div>
            </div>
            <div class="action-row">
                <button class="main-btn" id="start-btn" onclick="toggleTracking()">スタート</button>
                <button class="main-btn" id="photo-btn" onclick="triggerPhotoAdd()">写真追加</button>
            </div>
        </div>
    </div>

    <!-- TAB 2: 記録 -->
    <div id="tab-records" class="tab-content">
        <div class="page-container">
            <h2>旅の履歴</h2>
            <div class="calendar-header" style="margin-top:15px;">
                <button class="modal-btn cancel" style="padding:4px 8px;" onclick="changeMonth(-1)">&lt;</button>
                <span id="calendar-month-label" style="font-weight:bold;font-size:14px;"></span>
                <button class="modal-btn cancel" style="padding:4px 8px;" onclick="changeMonth(1)">&gt;</button>
            </div>
            <div class="calendar-grid" id="calendar-grid-container"></div>
            <div class="history-list" id="history-list-container"></div>
        </div>
    </div>

    <!-- TAB 3: プロフィール -->
    <div id="tab-profile" class="tab-content">
        <div class="page-container">
            <h2>プロフィール & アカウント</h2>
            <div class="profile-card">
                <h3 style="margin:0 0 4px 0; font-size:15px;">アカウント情報</h3>
                <label style="font-size:11px; color:#aaa;">ユーザー名</label>
                <input type="text" id="profile-name-input" placeholder="名前を入力..." onchange="saveProfileSettings()">
                <label style="font-size:11px; color:#aaa; display:block; margin-top:8px;">ひとこと</label>
                <textarea id="profile-bio-input" rows="2" placeholder="ひとことプロフィール..." onchange="saveProfileSettings()"></textarea>
            </div>
            <div class="profile-card">
                <h3 style="margin:0 0 8px 0; font-size:15px;">統計情報</h3>
                <p id="total-walk-count" style="margin:4px 0; font-size:13px; color:#aaa;">総お散歩回数: 0回</p>
                <p id="total-walk-dist" style="margin:4px 0; font-size:13px; color:#aaa;">総歩行距離: 0.00 km</p>
            </div>
            <div class="profile-card">
                <h3 style="margin:0 0 8px 0; font-size:15px;">思い出アルバム</h3>
                <div class="album-grid" id="profile-album-container">
                    <p style="color:#888; font-size:12px; grid-column: span 3; text-align: center;">写真がまだありません</p>
                </div>
            </div>
            <div class="profile-card">
                <button class="modal-btn danger" style="width:100%;" onclick="clearAllData()">全データをリセット</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('map', this)" id="nav-map-btn">
            <span>🗺️</span>
            <span>マップ</span>
        </button>
        <button class="nav-item" onclick="switchTab('records', this)" id="nav-records-btn">
            <span>📅</span>
            <span>記録</span>
        </button>
        <button class="nav-item" onclick="switchTab('profile', this)" id="nav-profile-btn">
            <span>👤</span>
            <span>プロフィール</span>
        </button>
    </nav>

    <input type="file" id="hidden-photo-input" accept="image/*" style="display:none;" onchange="handlePhotoSelected(event)">

    <!-- 記録名入力モーダル -->
    <div id="save-modal" class="modal">
        <div class="modal-content">
            <h3>旅の記録名</h3>
            <input type="text" id="walk-title-input" placeholder="例: 〇〇公園の散歩 など">
            <div class="modal-buttons">
                <button class="modal-btn submit" onclick="confirmSaveWalk()">保存する</button>
            </div>
        </div>
    </div>

    <!-- 写真コメント入力モーダル -->
    <div id="photo-modal" class="modal">
        <div class="modal-content">
            <h3>写真コメント</h3>
            <div style="text-align: center;">
                <img id="photo-preview-img" src="" style="max-width: 100%; max-height: 140px; border-radius: 8px; object-fit: cover;">
            </div>
            <textarea id="photo-comment-input" rows="3" placeholder="コメントを入力..."></textarea>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closePhotoModal()">キャンセル</button>
                <button class="modal-btn submit" onclick="savePhotoPinModal()">次へ（位置指定）</button>
            </div>
        </div>
    </div>

    <!-- 履歴詳細・マッププレビュー・共有モーダル -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <h3 id="detail-title">旅の詳細</h3>
            <div id="preview-map"></div>
            <div id="detail-info" style="font-size:12px; color:#ccc;"></div>
            <div class="modal-buttons" style="justify-content: space-between; flex-wrap: wrap;">
                <button class="modal-btn submit" onclick="triggerAddPhotoToHistory()">📷 写真追加</button>
                <button class="modal-btn submit" style="background:#0984e3;" onclick="shareWalkRecord()">🔗 共有</button>
                <button class="modal-btn cancel" onclick="closeDetailModal()">閉じる</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, currentMarker, editLine, tempPinMarker;
        let isTracking = false;
        let routeSegments = [];
        let currentSegmentCoords = [];
        let photosData = [];
        let walkHistories = JSON.parse(localStorage.getItem('walk_histories') || '[]');
        let userProfile = JSON.parse(localStorage.getItem('walk_profile') || '{"name":"ゲストさん","bio":""}');
        let pathColor = '#ffffff';
        let timerInterval, seconds = 0, totalDist = 0;
        let currentPosition = null;
        let tempPhotoUrl = null;
        let tempPhotoComment = '';

        let currentDate = new Date();
        let selectedDateStr = null;
        
        let activeActionMode = 'none'; 
        let targetHistoryId = null;
        let viewingHistoryId = null;
        let editedCoords = [];

        let previewMap = null;
        let previewLayerGroup = null;

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([35.6812, 139.7671], 16);
            L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            }).addTo(map);

            editLine = L.polyline([], { color: '#ff4757', weight: 4, dashArray: '5, 10' }).addTo(map);

            map.on('click', function(e) {
                if (activeActionMode === 'edit_route') {
                    editedCoords.push([e.latlng.lat, e.latlng.lng]);
                    editLine.setLatLngs(editedCoords);
                } else if (activeActionMode === 'add_photo_pin') {
                    const latlng = [e.latlng.lat, e.latlng.lng];
                    if (tempPinMarker) map.removeLayer(tempPinMarker);
                    tempPinMarker = L.marker(latlng).addTo(map).bindPopup('ここに配置').openPopup();
                    window.selectedPhotoLatLng = latlng;
                }
            });

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(pos => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    currentPosition = [lat, lng];
                    
                    if (!currentMarker) {
                        currentMarker = L.circleMarker(currentPosition, {
                            radius: 8, color: '#fff', fillColor: '#3388ff', fillOpacity: 1, weight: 2
                        }).addTo(map);
                        map.setView(currentPosition, 16);
                    } else {
                        currentMarker.setLatLng(currentPosition);
                    }

                    if (isTracking) {
                        currentSegmentCoords.push(currentPosition);
                        redrawActiveRoute();

                        if (currentSegmentCoords.length > 1) {
                            let prev = currentSegmentCoords[currentSegmentCoords.length - 2];
                            totalDist += map.distance(prev, currentPosition);
                            document.getElementById('dist-display').innerText = (totalDist / 1000).toFixed(2) + ' km';
                        }
                    }
                }, err => console.error(err), { enableHighAccuracy: true });
            }
            loadProfileSettings();
            updateProfileStats();
        }

        function forceSwitchToMapTab() {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-map').classList.add('active');
            document.getElementById('nav-map-btn').classList.add('active');
            setTimeout(() => { map.invalidateSize(); }, 150);
        }

        function switchTab(tabName, element) {
            if (activeActionMode !== 'none') {
                alert('作業中です。「完了」または「中断」を押してから切り替えてください。');
                return;
            }

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (tabName === 'map') {
                document.getElementById('tab-map').classList.add('active');
                setTimeout(() => { map.invalidateSize(); }, 100);
            } else if (tabName === 'records') {
                document.getElementById('tab-records').classList.add('active');
                renderCalendar();
                renderHistoryList();
            } else if (tabName === 'profile') {
                document.getElementById('tab-profile').classList.add('active');
                updateProfileStats();
                renderProfileAlbum();
            }
            element.classList.add('active');
        }

        function centerToCurrentLocation() {
            if (currentPosition) map.setView(currentPosition, 17);
        }

        function changeColor(color, element) {
            if (isTracking && currentSegmentCoords.length > 0) {
                routeSegments.push({ color: pathColor, coords: [...currentSegmentCoords] });
                const lastPoint = currentSegmentCoords[currentSegmentCoords.length - 1];
                currentSegmentCoords = [lastPoint];
            }
            pathColor = color;
            document.querySelectorAll('.color-dot').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        let polylineLayers = [];
        function redrawActiveRoute() {
            polylineLayers.forEach(l => map.removeLayer(l));
            polylineLayers = [];

            routeSegments.push({ color: pathColor, coords: currentSegmentCoords });
            routeSegments.forEach(seg => {
                if (seg.coords.length > 1) {
                    let line = L.polyline(seg.coords, { color: seg.color, weight: 5, opacity: 0.8 }).addTo(map);
                    polylineLayers.push(line);
                }
            });
            routeSegments.pop();
        }

        function toggleTracking() {
            isTracking = !isTracking;
            const btn = document.getElementById('start-btn');
            if (isTracking) {
                btn.classList.add('recording');
                btn.innerText = '終了して保存';
                routeSegments = [];
                currentSegmentCoords = currentPosition ? [currentPosition] : [];
                totalDist = 0;
                seconds = 0;
                photosData = [];
                polylineLayers.forEach(l => map.removeLayer(l));
                polylineLayers = [];
                
                timerInterval = setInterval(() => {
                    seconds++;
                    let m = String(Math.floor(seconds / 60)).padStart(2, '0');
                    let s = String(seconds % 60).padStart(2, '0');
                    document.getElementById('time-display').innerText = `${m}:${s}`;
                }, 1000);
            } else {
                btn.classList.remove('recording');
                btn.innerText = 'スタート';
                clearInterval(timerInterval);
                
                routeSegments.push({ color: pathColor, coords: [...currentSegmentCoords] });
                
                if (currentSegmentCoords.length > 0) {
                    document.getElementById('walk-title-input').value = `旅の記録 (${new Date().toLocaleDateString()})`;
                    document.getElementById('save-modal').style.display = 'flex';
                }
            }
        }

        function confirmSaveWalk() {
            const title = document.getElementById('walk-title-input').value || 'お散歩';
            document.getElementById('save-modal').style.display = 'none';

            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            let allCoords = [];
            routeSegments.forEach(seg => allCoords.push(...seg.coords));

            const newHistory = {
                id: Date.now(),
                title: title,
                dateStr: dateStr,
                timeStr: timeStr,
                distance: (totalDist / 1000).toFixed(2) + ' km',
                time: document.getElementById('time-display').innerText,
                segments: [...routeSegments],
                coordinates: allCoords,
                photos: [...photosData]
            };
            walkHistories.unshift(newHistory);
            localStorage.setItem('walk_histories', JSON.stringify(walkHistories));
            alert('旅の記録を保存しました！');
            updateProfileStats();
        }

        function triggerPhotoAdd() {
            targetHistoryId = null; 
            document.getElementById('hidden-photo-input').click();
        }

        function handlePhotoSelected(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                tempPhotoUrl = e.target.result;
                document.getElementById('photo-preview-img').src = tempPhotoUrl;
                document.getElementById('photo-comment-input').value = '';
                document.getElementById('photo-modal').style.display = 'flex';
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function closePhotoModal() {
            document.getElementById('photo-modal').style.display = 'none';
        }

        function savePhotoPinModal() {
            tempPhotoComment = document.getElementById('photo-comment-input').value;
            closePhotoModal();

            forceSwitchToMapTab();
            startSelectPhotoLocation();
        }

        function startSelectPhotoLocation() {
            activeActionMode = 'add_photo_pin';
            window.selectedPhotoLatLng = null;
            document.getElementById('top-action-text').innerText = 'マップ上の撮影場所をタップして指定';
            document.getElementById('top-action-bar').style.display = 'flex';
        }

        function addPhotoMarkerToMap(item) {
            const customIcon = L.divIcon({
                className: 'custom-photo-pin',
                html: `<div style="width:32px;height:32px;border-radius:50%;overflow:hidden;border:2px solid #fff;background:#000;"><img src="${item.url}" style="width:100%;height:100%;object-fit:cover;"></div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });
            L.marker([item.lat, item.lng], { icon: customIcon })
              .addTo(map)
              .bindPopup(`<b>${item.date}</b><br><img src="${item.url}" style="width:120px;border-radius:6px;margin-top:4px;"><br><p style="margin:4px 0 0 0;font-size:12px;">${item.comment}</p>`);
        }

        function triggerAddPhotoToHistory() {
            closeDetailModal();
            targetHistoryId = viewingHistoryId;
            document.getElementById('hidden-photo-input').click();
        }

        function loadProfileSettings() {
            document.getElementById('profile-name-input').value = userProfile.name || '';
            document.getElementById('profile-bio-input').value = userProfile.bio || '';
        }

        function saveProfileSettings() {
            userProfile.name = document.getElementById('profile-name-input').value;
            userProfile.bio = document.getElementById('profile-bio-input').value;
            localStorage.setItem('walk_profile', JSON.stringify(userProfile));
        }

        function renderProfileAlbum() {
            const container = document.getElementById('profile-album-container');
            container.innerHTML = '';
            
            let allPhotos = [];
            walkHistories.forEach(h => {
                if (h.photos && h.photos.length > 0) {
                    h.photos.forEach(p => allPhotos.push(p));
                }
            });

            if (allPhotos.length === 0) {
                container.innerHTML = '<p style="color:#888; font-size:12px; grid-column: span 3; text-align: center; margin: 10px 0;">写真がまだありません</p>';
                return;
            }

            allPhotos.forEach(p => {
                const img = document.createElement('img');
                img.className = 'album-thumb';
                img.src = p.url;
                img.onclick = () => {
                    alert(`[${p.date}] ${p.comment || 'コメントなし'}`);
                };
                container.appendChild(img);
            });
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('calendar-month-label').innerText = `${year}年 ${month + 1}月`;
            
            const container = document.getElementById('calendar-grid-container');
            container.innerHTML = '';

            const days = ['日', '月', '火', '水', '木', '金', '土'];
            days.forEach(d => {
                const head = document.createElement('div');
                head.className = 'calendar-day-head';
                head.innerText = d;
                container.appendChild(head);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                container.appendChild(document.createElement('div'));
            }

            for (let d = 1; d <= lastDate; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const hasData = walkHistories.some(h => h.dateStr === dateStr);
                
                const cell = document.createElement('div');
                cell.className = `calendar-cell ${hasData ? 'has-data' : ''} ${selectedDateStr === dateStr ? 'selected' : ''}`;
                cell.innerText = d;
                cell.onclick = () => {
                    selectedDateStr = (selectedDateStr === dateStr) ? null : dateStr;
                    renderCalendar();
                    renderHistoryList();
                };
                container.appendChild(cell);
            }
        }

        function renderHistoryList() {
            const container = document.getElementById('history-list-container');
            container.innerHTML = '';
            
            let filtered = walkHistories;
            if (selectedDateStr) {
                filtered = walkHistories.filter(h => h.dateStr === selectedDateStr);
            }

            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#888;font-size:12px;margin:10px 0;">記録はありません</p>';
                return;
            }

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div>
                        <div style="font-size:12px;font-weight:bold;color:#fff;">${item.title || '旅の記録'}</div>
                        <div style="font-size:11px;color:#aaa;">${item.dateStr} / 距離: ${item.distance}</div>
                    </div>
                    <div style="display:flex;gap:4px;">
                        <button class="modal-btn submit" style="padding:4px 6px;font-size:11px;" onclick="openDetailModal(${item.id})">見る</button>
                        <button class="modal-btn submit" style="padding:4px 6px;font-size:11px;" onclick="startEditRoute(${item.id})">補正</button>
                        <button class="modal-btn danger" style="padding:4px 6px;font-size:11px;" onclick="deleteHistory(${item.id})">削除</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function openDetailModal(id) {
            const item = walkHistories.find(h => h.id === id);
            if (!item) return;
            viewingHistoryId = id;

            document.getElementById('detail-title').innerText = item.title || `${item.dateStr} の記録`;
            document.getElementById('detail-info').innerHTML = `距離: <b>${item.distance}</b> / 時間: <b>${item.time}</b> / 写真: <b>${item.photos ? item.photos.length : 0}枚</b>`;
            document.getElementById('detail-modal').style.display = 'flex';

            setTimeout(() => {
                if (!previewMap) {
                    previewMap = L.map('preview-map', { zoomControl: false });
                    L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                        maxZoom: 20,
                        subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
                    }).addTo(previewMap);
                } else {
                    previewMap.invalidateSize();
                }

                if (previewLayerGroup) {
                    previewMap.removeLayer(previewLayerGroup);
                }
                previewLayerGroup = L.layerGroup().addTo(previewMap);

                if (item.segments && item.segments.length > 0) {
                    item.segments.forEach(seg => {
                        if (seg.coords && seg.coords.length > 0) {
                            L.polyline(seg.coords, { color: seg.color || '#ffffff', weight: 4, opacity: 0.9 }).addTo(previewLayerGroup);
                        }
                    });
                } else if (item.coordinates && item.coordinates.length > 0) {
                    L.polyline(item.coordinates, { color: '#ffffff', weight: 4, opacity: 0.9 }).addTo(previewLayerGroup);
                }

                if (item.photos && item.photos.length > 0) {
                    item.photos.forEach(p => {
                        const customIcon = L.divIcon({
                            className: 'custom-photo-pin',
                            html: `<div style="width:26px;height:26px;border-radius:50%;overflow:hidden;border:2px solid #fff;background:#000;"><img src="${p.url}" style="width:100%;height:100%;object-fit:cover;"></div>`,
                            iconSize: [26, 26],
                            iconAnchor: [13, 13]
                        });
                        L.marker([p.lat, p.lng], { icon: customIcon })
                          .addTo(previewLayerGroup)
                          .bindPopup(`<b>${p.date || ''}</b><br><img src="${p.url}" style="width:120px;border-radius:6px;margin-top:4px;"><br><p style="margin:4px 0 0 0;font-size:12px;">${p.comment || ''}</p>`);
                    });
                }

                let allPts = item.coordinates || [];
                if (item.segments) {
                    item.segments.forEach(s => allPts.push(...s.coords));
                }
                if (allPts.length > 0) {
                    previewMap.fitBounds(allPts, { padding: [30, 30] });
                } else {
                    previewMap.setView([35.6812, 139.7671], 15);
                }
            }, 200);
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').style.display = 'none';
        }

        function shareWalkRecord() {
            const item = walkHistories.find(h => h.id === viewingHistoryId);
            if (!item) return;
            const text = `【MyTrail 旅の記録: ${item.title || '記録'}】\n日付: ${item.dateStr}\n距離: ${item.distance}\n時間: ${item.time}\n#MyTrail`;
            
            if (navigator.share) {
                navigator.share({ title: item.title, text: text }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    alert('旅の記録のテキストをコピーしました！');
                });
            }
        }

        function deleteHistory(id) {
            if (confirm('この記録を削除しますか？')) {
                walkHistories = walkHistories.filter(h => h.id !== id);
                localStorage.setItem('walk_histories', JSON.stringify(walkHistories));
                renderCalendar();
                renderHistoryList();
                updateProfileStats();
            }
        }

        function updateProfileStats() {
            const count = walkHistories.length;
            let totalKm = 0;
            walkHistories.forEach(h => {
                const km = parseFloat(h.distance.replace(' km', '')) || 0;
                totalKm += km;
            });
            document.getElementById('total-walk-count').innerText = `総お散歩回数: ${count}回`;
            document.getElementById('total-walk-dist').innerText = `総歩行距離: ${totalKm.toFixed(2)} km`;
        }

        function clearAllData() {
            if (confirm('すべての履歴データを消去しますか？この操作は元に戻せません。')) {
                localStorage.removeItem('walk_histories');
                walkHistories = [];
                renderCalendar();
                renderHistoryList();
                updateProfileStats();
                renderProfileAlbum();
                alert('データをリセットしました');
            }
        }

        function finishTopAction() {
            if (activeActionMode === 'edit_route') {
                if (editedCoords.length < 2) {
                    alert('マップ上を2点以上タップしてラインを描いてください。');
                    return;
                }
                const history = walkHistories.find(h => h.id === editingHistoryId);
                if (history) {
                    history.coordinates = editedCoords;
                    history.segments = [{ color: '#3388ff', coords: editedCoords }];
                    
                    let dist = 0;
                    for (let i = 1; i < editedCoords.length; i++) {
                        dist += map.distance(editedCoords[i-1], editedCoords[i]);
                    }
                    history.distance = (dist / 1000).toFixed(2) + ' km';
                    
                    localStorage.setItem('walk_histories', JSON.stringify(walkHistories));
                    alert('ルートを書き換えて保存しました');
                    updateProfileStats();
                }
            } else if (activeActionMode === 'add_photo_pin') {
                if (!window.selectedPhotoLatLng) {
                    alert('マップ上のどこかをタップしてピン位置を指定してください。');
                    return;
                }
                
                const now = new Date();
                const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                const photoItem = {
                    lat: window.selectedPhotoLatLng[0],
                    lng: window.selectedPhotoLatLng[1],
                    url: tempPhotoUrl,
                    comment: tempPhotoComment || '',
                    date: timeStr
                };

                if (targetHistoryId) {
                    const history = walkHistories.find(h => h.id === targetHistoryId);
                    if (history) {
                        if (!history.photos) history.photos = [];
                        history.photos.push(photoItem);
                        localStorage.setItem('walk_histories', JSON.stringify(walkHistories));
                        alert('旅の記録に写真を追加しました！');
                    }
                } else {
                    photosData.push(photoItem);
                    addPhotoMarkerToMap(photoItem);
                    alert('写真をピン留めしました！');
                }
            }
            cancelTopAction();
        }

        function cancelTopAction() {
            activeActionMode = 'none';
            editingHistoryId = null;
            targetHistoryId = null;
            editedCoords = [];
            editLine.setLatLngs([]);
            if (tempPinMarker) {
                map.removeLayer(tempPinMarker);
                tempPinMarker = null;
            }
            document.getElementById('top-action-bar').style.display = 'none';
        }

        function startEditRoute(id) {
            editingHistoryId = id;
            activeActionMode = 'edit_route';
            editedCoords = [];
            editLine.setLatLngs([]);
            forceSwitchToMapTab();
            document.getElementById('top-action-text').innerText = 'マップをタップしてルートを描き直し';
            document.getElementById('top-action-bar').style.display = 'flex';
        }

        window.onload = initMap;
    </script>
</body>
</html>
